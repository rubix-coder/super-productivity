<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Note</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        padding: 12px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #noteContainer {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: #ffd93d;
      }

      #noteTitle {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 8px;
        word-break: break-word;
        line-height: 1.4;
        opacity: 0.9;
      }

      #noteSubTasks {
        flex: 1;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.6;
      }

      .subtask {
        margin: 2px 0;
        padding: 2px 4px;
        cursor: pointer;
      }

      .subtask.done {
        text-decoration: line-through;
        opacity: 0.6;
      }

      #noteActions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        min-width: 45px;
        padding: 4px 6px;
        font-size: 11px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.6);
      }

      button:active {
        background: rgba(255, 255, 255, 0.8);
      }

      .color-btn {
        width: 20px;
        min-width: 20px;
        padding: 2px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="noteContainer">
      <div id="noteTitle"></div>
      <ul id="noteSubTasks"></ul>
      <div id="noteActions">
        <button id="completeBtn">✓ Done</button>
        <button id="skipBtn">→ Skip</button>
        <button id="deleteBtn">✕ Del</button>
        <button id="colorBtn" style="flex: 0.5">◉</button>
      </div>
    </div>

    <script>
      let currentNote = null;

      window.ea.on('STICKY_NOTE_DATA', (event, note) => {
        currentNote = note;
        renderNote(note);
      });

      function renderNote(note) {
        const container = document.getElementById('noteContainer');
        const titleEl = document.getElementById('noteTitle');
        const subTasksEl = document.getElementById('noteSubTasks');

        // Set background color
        container.style.backgroundColor = note.color;

        // Set title
        titleEl.textContent = note.title;

        // Placeholder for subtasks (will be sent in next phase)
        subTasksEl.innerHTML = '';
      }

      document.getElementById('completeBtn').addEventListener('click', () => {
        if (currentNote) {
          window.ea.send('STICKY_ACTION', {
            taskId: currentNote.taskId,
            action: 'complete',
          });
        }
      });

      document.getElementById('skipBtn').addEventListener('click', () => {
        if (currentNote) {
          window.ea.send('STICKY_ACTION', {
            taskId: currentNote.taskId,
            action: 'skip',
          });
        }
      });

      document.getElementById('deleteBtn').addEventListener('click', () => {
        if (currentNote) {
          window.ea.send('STICKY_ACTION', {
            taskId: currentNote.taskId,
            action: 'delete',
          });
        }
      });

      document.getElementById('colorBtn').addEventListener('click', () => {
        if (currentNote) {
          window.ea.send('STICKY_ACTION', {
            taskId: currentNote.taskId,
            action: 'showColorMenu',
          });
        }
      });
    </script>
  </body>
</html>
